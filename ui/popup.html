<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <title>Secure Chat Extension</title>
    <link rel="stylesheet" href="popup.css">

</head>
<body>
    <h1>Secure Chat</h1>
    <p>End-to-End Encryption Extension</p>

    <h2>Encryption Control</h2>

    <label for="encryptionToggle">
        Enable Encryption
    </label>
    <input type="checkbox" id="encryptionToggle">

    <p>
        Encryption setting: <span id="encryptionStatus">Disabled</span>
    </p>

    <h2>Your Public Key </h2>
    
    <textarea id="publicKey" rows="4" readonly
        placeholder="No public key available"></textarea>

    <button id="copyPublicKey">Copy Public Key</button>

    <h2>Recipient's Public Key</h2>

    <p>Paste the public key shared by your messaging contact.</p>

    <textarea id="recipientPublicKey" rows="4"
        placeholder="Paste recipient's public key here"></textarea>

    <button id="saveRecipientKey">Save Recipient Key</button>

    <p id="recipientKeyMessage"></p>

    <h2>Key Status</h2>

    <p>Your key: <span id="identityKeyStatus">Checking...</span></p>

    <p>Recipient's key: <span id="peerKeyStatus">Checking...</span></p>

    <p>Encryption session: <span id="sessionKeyStatus">Checking...</span></p>

    <script src="../crypto/keyManager.js"></script>
    <script src="popup.js"></script>
    
</body>
</html>
